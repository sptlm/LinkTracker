server:
  port: 8081

spring:
  application:
    name: scrapper
  datasource:
    url: ${SCRAPPER_DATASOURCE_URL:jdbc:postgresql://localhost:5433/linktracker}
    username: ${SCRAPPER_DATASOURCE_USERNAME:postgres}
    password: ${SCRAPPER_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SCRAPPER_VALKEY_HOST:localhost}
      port: ${SCRAPPER_VALKEY_PORT:6379}
      timeout: ${SCRAPPER_VALKEY_TIMEOUT:2s}
      repositories:
        enabled: false

app:
  valkey:
    cache:
      enabled: ${SCRAPPER_VALKEY_CACHE_ENABLED:true}
      ttl: ${SCRAPPER_VALKEY_CACHE_TTL:10m}
      client-side:
        enabled: ${SCRAPPER_VALKEY_CLIENT_SIDE_CACHE_ENABLED:true}
        max-size: ${SCRAPPER_VALKEY_CLIENT_SIDE_CACHE_MAX_SIZE:10000}
      host-mapping:
        enabled: ${SCRAPPER_VALKEY_HOST_MAPPING_ENABLED:true}
        source: ${SCRAPPER_VALKEY_HOST_MAPPING_SOURCE:host.docker.internal}
        target: ${SCRAPPER_VALKEY_HOST_MAPPING_TARGET:localhost}
  notifications:
    transport: ${SCRAPPER_NOTIFICATION_TRANSPORT:KAFKA}
  kafka:
    bootstrap-servers: ${SCRAPPER_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    updates-topic: ${SCRAPPER_KAFKA_UPDATES_TOPIC:link-updates}
    updates-topic-partitions: ${SCRAPPER_KAFKA_UPDATES_TOPIC_PARTITIONS:3}
    updates-topic-replication-factor: ${SCRAPPER_KAFKA_UPDATES_TOPIC_REPLICATION_FACTOR:3}
    updates-topic-min-in-sync-replicas: ${SCRAPPER_KAFKA_UPDATES_TOPIC_MIN_IN_SYNC_REPLICAS:2}
    key-serializer: ${SCRAPPER_KAFKA_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
    value-serializer: ${SCRAPPER_KAFKA_VALUE_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
    schema-registry-url: ${SCRAPPER_KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8085}
    direct-publisher-enabled: ${SCRAPPER_KAFKA_DIRECT_PUBLISHER_ENABLED:false}
    outbox-dispatch-interval: ${SCRAPPER_KAFKA_OUTBOX_DISPATCH_INTERVAL:1s}
    outbox-max-attempts: ${SCRAPPER_KAFKA_OUTBOX_MAX_ATTEMPTS:5}
    outbox-batch-size: ${SCRAPPER_KAFKA_OUTBOX_BATCH_SIZE:100}
  clients:
    bot-base-url: http://localhost:8080
  stackoverflow:
    base-url: https://api.stackexchange.com/2.3
    key: ${STACKOVERFLOW_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
    access-token: ${STACKOVERFLOW_ACCESS_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
  github:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
  polling:
    enabled: ${SCRAPPER_POLLING_ENABLED:false}
    interval: 60s
  persistence:
    access-type: ${SCRAPPER_ACCESS_TYPE:ORM}
    polling-batch-size: 100
---
spring:
  config:
    activate:
      on-profile: "!test"
  data:
    redis:
      cluster:
        nodes: ${SCRAPPER_VALKEY_CLUSTER_NODES:localhost:6380,localhost:6381,localhost:6382}
      timeout: ${SCRAPPER_VALKEY_TIMEOUT:2s}
      repositories:
        enabled: false

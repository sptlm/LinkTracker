server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      app_type: scrapper
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        pushgateway:
          enabled: ${SCRAPPER_PUSHGATEWAY_ENABLED:false}
          address: ${SCRAPPER_PUSHGATEWAY_ADDRESS:localhost:9091}
          job: ${spring.application.name}
          push-rate: ${SCRAPPER_PUSHGATEWAY_PUSH_RATE:30s}
          grouping-key:
            application: ${spring.application.name}
            app_type: scrapper

spring:
  application:
    name: scrapper
  datasource:
    url: ${SCRAPPER_DATASOURCE_URL:jdbc:postgresql://localhost:5433/linktracker}
    username: ${SCRAPPER_DATASOURCE_USERNAME:postgres}
    password: ${SCRAPPER_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SCRAPPER_VALKEY_HOST:localhost}
      port: ${SCRAPPER_VALKEY_PORT:6379}
      timeout: ${SCRAPPER_VALKEY_TIMEOUT:2s}
      repositories:
        enabled: false

app:
  http-client:
    connect-timeout: ${SCRAPPER_HTTP_CONNECT_TIMEOUT:1s}
    read-timeout: ${SCRAPPER_HTTP_READ_TIMEOUT:2s}
  resilience:
    http:
      retryable-statuses: ${SCRAPPER_HTTP_RETRYABLE_STATUSES:500,502,503,504}
  rate-limit:
    enabled: ${SCRAPPER_RATE_LIMIT_ENABLED:true}
    capacity: ${SCRAPPER_RATE_LIMIT_CAPACITY:60}
    refill-tokens: ${SCRAPPER_RATE_LIMIT_REFILL_TOKENS:60}
    refill-period: ${SCRAPPER_RATE_LIMIT_REFILL_PERIOD:1m}
    cache-expire-after-access: ${SCRAPPER_RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS:10m}
    cache-maximum-size: ${SCRAPPER_RATE_LIMIT_CACHE_MAXIMUM_SIZE:10000}
  valkey:
    cache:
      enabled: ${SCRAPPER_VALKEY_CACHE_ENABLED:true}
      ttl: ${SCRAPPER_VALKEY_CACHE_TTL:10m}
      client-side:
        enabled: ${SCRAPPER_VALKEY_CLIENT_SIDE_CACHE_ENABLED:true}
        max-size: ${SCRAPPER_VALKEY_CLIENT_SIDE_CACHE_MAX_SIZE:10000}
      host-mapping:
        enabled: ${SCRAPPER_VALKEY_HOST_MAPPING_ENABLED:true}
        source: ${SCRAPPER_VALKEY_HOST_MAPPING_SOURCE:host.docker.internal}
        target: ${SCRAPPER_VALKEY_HOST_MAPPING_TARGET:localhost}
  notifications:
    transport: ${SCRAPPER_NOTIFICATION_TRANSPORT:KAFKA}
  kafka:
    bootstrap-servers: ${SCRAPPER_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    updates-topic: ${SCRAPPER_KAFKA_UPDATES_TOPIC:link.raw-updates}
    updates-topic-partitions: ${SCRAPPER_KAFKA_UPDATES_TOPIC_PARTITIONS:3}
    updates-topic-replication-factor: ${SCRAPPER_KAFKA_UPDATES_TOPIC_REPLICATION_FACTOR:3}
    updates-topic-min-in-sync-replicas: ${SCRAPPER_KAFKA_UPDATES_TOPIC_MIN_IN_SYNC_REPLICAS:2}
    key-serializer: ${SCRAPPER_KAFKA_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
    value-serializer: ${SCRAPPER_KAFKA_VALUE_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
    schema-registry-url: ${SCRAPPER_KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8085}
    direct-publisher-enabled: ${SCRAPPER_KAFKA_DIRECT_PUBLISHER_ENABLED:false}
    outbox-dispatch-interval: ${SCRAPPER_KAFKA_OUTBOX_DISPATCH_INTERVAL:1s}
    outbox-max-attempts: ${SCRAPPER_KAFKA_OUTBOX_MAX_ATTEMPTS:5}
    outbox-batch-size: ${SCRAPPER_KAFKA_OUTBOX_BATCH_SIZE:100}
  clients:
    bot-base-url: http://localhost:8080
  stackoverflow:
    base-url: https://api.stackexchange.com/2.3
    key: ${STACKOVERFLOW_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
    access-token: ${STACKOVERFLOW_ACCESS_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
  github:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
  polling:
    enabled: ${SCRAPPER_POLLING_ENABLED:false}
    interval: 60s
  persistence:
    access-type: ${SCRAPPER_ACCESS_TYPE:ORM}
    polling-batch-size: 100

resilience4j:
  retry:
    instances:
      github:
        max-attempts: ${SCRAPPER_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${SCRAPPER_RETRY_WAIT_DURATION:250ms}
        retry-exceptions:
          - backend.academy.linktracker.scrapper.api.exception.RetryableHttpStatusException
        enable-exponential-backoff: ${SCRAPPER_RETRY_EXPONENTIAL_BACKOFF_ENABLED:false}
        exponential-backoff-multiplier: ${SCRAPPER_RETRY_EXPONENTIAL_BACKOFF_MULTIPLIER:2}
        exponential-max-wait-duration: ${SCRAPPER_RETRY_EXPONENTIAL_MAX_WAIT_DURATION:5s}
      stackoverflow:
        max-attempts: ${SCRAPPER_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${SCRAPPER_RETRY_WAIT_DURATION:250ms}
        retry-exceptions:
          - backend.academy.linktracker.scrapper.api.exception.RetryableHttpStatusException
        enable-exponential-backoff: ${SCRAPPER_RETRY_EXPONENTIAL_BACKOFF_ENABLED:false}
        exponential-backoff-multiplier: ${SCRAPPER_RETRY_EXPONENTIAL_BACKOFF_MULTIPLIER:2}
        exponential-max-wait-duration: ${SCRAPPER_RETRY_EXPONENTIAL_MAX_WAIT_DURATION:5s}
      bot:
        max-attempts: ${SCRAPPER_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${SCRAPPER_RETRY_WAIT_DURATION:250ms}
        retry-exceptions:
          - backend.academy.linktracker.scrapper.api.exception.RetryableHttpStatusException
        enable-exponential-backoff: ${SCRAPPER_RETRY_EXPONENTIAL_BACKOFF_ENABLED:false}
        exponential-backoff-multiplier: ${SCRAPPER_RETRY_EXPONENTIAL_BACKOFF_MULTIPLIER:2}
        exponential-max-wait-duration: ${SCRAPPER_RETRY_EXPONENTIAL_MAX_WAIT_DURATION:5s}
  circuitbreaker:
    instances:
      github:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${SCRAPPER_CB_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${SCRAPPER_CB_MINIMUM_REQUIRED_CALLS:5}
        failure-rate-threshold: ${SCRAPPER_CB_FAILURE_RATE_THRESHOLD:50}
        permitted-number-of-calls-in-half-open-state: ${SCRAPPER_CB_PERMITTED_CALLS_IN_HALF_OPEN_STATE:5}
        wait-duration-in-open-state: ${SCRAPPER_CB_WAIT_DURATION_IN_OPEN_STATE:1s}
        automatic-transition-from-open-to-half-open-enabled: ${SCRAPPER_CB_AUTO_TRANSITION_ENABLED:true}
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      stackoverflow:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${SCRAPPER_CB_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${SCRAPPER_CB_MINIMUM_REQUIRED_CALLS:5}
        failure-rate-threshold: ${SCRAPPER_CB_FAILURE_RATE_THRESHOLD:50}
        permitted-number-of-calls-in-half-open-state: ${SCRAPPER_CB_PERMITTED_CALLS_IN_HALF_OPEN_STATE:5}
        wait-duration-in-open-state: ${SCRAPPER_CB_WAIT_DURATION_IN_OPEN_STATE:1s}
        automatic-transition-from-open-to-half-open-enabled: ${SCRAPPER_CB_AUTO_TRANSITION_ENABLED:true}
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      bot:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${SCRAPPER_CB_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${SCRAPPER_CB_MINIMUM_REQUIRED_CALLS:5}
        failure-rate-threshold: ${SCRAPPER_CB_FAILURE_RATE_THRESHOLD:50}
        permitted-number-of-calls-in-half-open-state: ${SCRAPPER_CB_PERMITTED_CALLS_IN_HALF_OPEN_STATE:5}
        wait-duration-in-open-state: ${SCRAPPER_CB_WAIT_DURATION_IN_OPEN_STATE:1s}
        automatic-transition-from-open-to-half-open-enabled: ${SCRAPPER_CB_AUTO_TRANSITION_ENABLED:true}
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
---
spring:
  config:
    activate:
      on-profile: "!test"
  data:
    redis:
      cluster:
        nodes: ${SCRAPPER_VALKEY_CLUSTER_NODES:localhost:6380,localhost:6381,localhost:6382}
      timeout: ${SCRAPPER_VALKEY_TIMEOUT:2s}
      repositories:
        enabled: false

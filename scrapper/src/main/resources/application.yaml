server:
  port: 8081

spring:
  application:
    name: scrapper
  datasource:
    url: ${SCRAPPER_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/linktracker}}
    username: ${SCRAPPER_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${SCRAPPER_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  clients:
    bot-base-url: http://localhost:8080
  stackoverflow:
    base-url: https://api.stackexchange.com/2.3
    key: ${STACKOVERFLOW_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
    access-token: ${STACKOVERFLOW_ACCESS_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
  github:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
  polling:
    interval: 60s
  persistence:
    access-type: ${SCRAPPER_ACCESS_TYPE:SQL}
    polling-batch-size: 100

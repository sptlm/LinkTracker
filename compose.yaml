services:
  postgres:
    image: postgres:17-alpine
    container_name: linktracker-postgres
    environment:
      POSTGRES_DB: linktracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linktracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-cluster-1:
    image: valkey/valkey:8.0-alpine
    container_name: linktracker-valkey-cluster-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - valkey-server
      - --port
      - "6379"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - host.docker.internal
      - --cluster-announce-port
      - "6380"
      - --cluster-announce-bus-port
      - "16380"
    ports:
      - "6380:6379"
      - "16380:16379"
    volumes:
      - valkey-cluster-1-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-cluster-2:
    image: valkey/valkey:8.0-alpine
    container_name: linktracker-valkey-cluster-2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - valkey-server
      - --port
      - "6379"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - host.docker.internal
      - --cluster-announce-port
      - "6381"
      - --cluster-announce-bus-port
      - "16381"
    ports:
      - "6381:6379"
      - "16381:16379"
    volumes:
      - valkey-cluster-2-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-cluster-3:
    image: valkey/valkey:8.0-alpine
    container_name: linktracker-valkey-cluster-3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - valkey-server
      - --port
      - "6379"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - host.docker.internal
      - --cluster-announce-port
      - "6382"
      - --cluster-announce-bus-port
      - "16382"
    ports:
      - "6382:6379"
      - "16382:16379"
    volumes:
      - valkey-cluster-3-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-cluster-init:
    image: valkey/valkey:8.0-alpine
    container_name: linktracker-valkey-cluster-init
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      valkey-cluster-1:
        condition: service_healthy
      valkey-cluster-2:
        condition: service_healthy
      valkey-cluster-3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "valkey-cli -h host.docker.internal -p 6380 cluster info | grep -q 'cluster_state:ok'
      || valkey-cli --cluster create
      host.docker.internal:6380 host.docker.internal:6381 host.docker.internal:6382
      --cluster-replicas 0 --cluster-yes"

  kafka-1:
    image: confluentinc/cp-kafka:7.7.1
    container_name: linktracker-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-2:
    image: confluentinc/cp-kafka:7.7.1
    container_name: linktracker-kafka-2
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-3:
    image: confluentinc/cp-kafka:7.7.1
    container_name: linktracker-kafka-3
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 5s
      timeout: 5s
      retries: 10


  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: linktracker-schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:29092,PLAINTEXT://kafka-2:29092,PLAINTEXT://kafka-3:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-topics-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: linktracker-kafka-topics-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command: >
      "kafka-topics --bootstrap-server kafka-1:29092,kafka-2:29092,kafka-3:29092
      --create --if-not-exists --topic link-updates --partitions 3 --replication-factor 3
      --config min.insync.replicas=2"

volumes:
  postgres-data:
  valkey-cluster-1-data:
  valkey-cluster-2-data:
  valkey-cluster-3-data:

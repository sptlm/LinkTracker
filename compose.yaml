services:
  postgres:
    image: postgres:17-alpine
    container_name: linktracker-postgres
    environment:
      POSTGRES_DB: linktracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linktracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-cluster-1:
    image: valkey/valkey:8.0-alpine
    container_name: linktracker-valkey-cluster-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - valkey-server
      - --port
      - "6379"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - host.docker.internal
      - --cluster-announce-port
      - "6380"
      - --cluster-announce-bus-port
      - "16380"
    ports:
      - "6380:6379"
      - "16380:16379"
    volumes:
      - valkey-cluster-1-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-cluster-2:
    image: valkey/valkey:8.0-alpine
    container_name: linktracker-valkey-cluster-2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - valkey-server
      - --port
      - "6379"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - host.docker.internal
      - --cluster-announce-port
      - "6381"
      - --cluster-announce-bus-port
      - "16381"
    ports:
      - "6381:6379"
      - "16381:16379"
    volumes:
      - valkey-cluster-2-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-cluster-3:
    image: valkey/valkey:8.0-alpine
    container_name: linktracker-valkey-cluster-3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - valkey-server
      - --port
      - "6379"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - host.docker.internal
      - --cluster-announce-port
      - "6382"
      - --cluster-announce-bus-port
      - "16382"
    ports:
      - "6382:6379"
      - "16382:16379"
    volumes:
      - valkey-cluster-3-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-cluster-4:
    image: valkey/valkey:8.0-alpine
    container_name: linktracker-valkey-cluster-4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - valkey-server
      - --port
      - "6379"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - host.docker.internal
      - --cluster-announce-port
      - "6383"
      - --cluster-announce-bus-port
      - "16383"
    ports:
      - "6383:6379"
      - "16383:16379"
    volumes:
      - valkey-cluster-4-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-cluster-5:
    image: valkey/valkey:8.0-alpine
    container_name: linktracker-valkey-cluster-5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - valkey-server
      - --port
      - "6379"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - host.docker.internal
      - --cluster-announce-port
      - "6384"
      - --cluster-announce-bus-port
      - "16384"
    ports:
      - "6384:6379"
      - "16384:16379"
    volumes:
      - valkey-cluster-5-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-cluster-6:
    image: valkey/valkey:8.0-alpine
    container_name: linktracker-valkey-cluster-6
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - valkey-server
      - --port
      - "6379"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - host.docker.internal
      - --cluster-announce-port
      - "6385"
      - --cluster-announce-bus-port
      - "16385"
    ports:
      - "6385:6379"
      - "16385:16379"
    volumes:
      - valkey-cluster-6-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-cluster-init:
    image: valkey/valkey:8.0-alpine
    container_name: linktracker-valkey-cluster-init
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      valkey-cluster-1:
        condition: service_healthy
      valkey-cluster-2:
        condition: service_healthy
      valkey-cluster-3:
        condition: service_healthy
      valkey-cluster-4:
        condition: service_healthy
      valkey-cluster-5:
        condition: service_healthy
      valkey-cluster-6:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "if valkey-cli -h host.docker.internal -p 6380 cluster info | grep -q 'cluster_state:ok'; then
        valkey-cli -h host.docker.internal -p 6380 cluster nodes | awk 'END { exit NR >= 6 ? 0 : 1 }';
      else
        valkey-cli --cluster create host.docker.internal:6380 host.docker.internal:6381 host.docker.internal:6382 host.docker.internal:6383 host.docker.internal:6384 host.docker.internal:6385 --cluster-replicas 1 --cluster-yes;
      fi"

  kafka-1:
    image: confluentinc/cp-kafka:7.7.1
    container_name: linktracker-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-2:
    image: confluentinc/cp-kafka:7.7.1
    container_name: linktracker-kafka-2
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-3:
    image: confluentinc/cp-kafka:7.7.1
    container_name: linktracker-kafka-3
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 5s
      timeout: 5s
      retries: 10


  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: linktracker-schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:29092,PLAINTEXT://kafka-2:29092,PLAINTEXT://kafka-3:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-topics-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: linktracker-kafka-topics-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command: >
      "kafka-topics --bootstrap-server kafka-1:29092,kafka-2:29092,kafka-3:29092
      --create --if-not-exists --topic link.raw-updates --partitions 3 --replication-factor 3
      --config min.insync.replicas=2
      && kafka-topics --bootstrap-server kafka-1:29092,kafka-2:29092,kafka-3:29092
      --create --if-not-exists --topic link.processed-updates --partitions 3 --replication-factor 3
      --config min.insync.replicas=2"

  scrapper:
    build:
      context: .
      dockerfile: scrapper/Dockerfile
    image: linktracker-observability-scrapper:0.0.1
    container_name: linktracker-scrapper
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      pushgateway:
        condition: service_started
    environment:
      SCRAPPER_DATASOURCE_URL: jdbc:postgresql://postgres:5432/linktracker
      SCRAPPER_DATASOURCE_USERNAME: postgres
      SCRAPPER_DATASOURCE_PASSWORD: postgres
      SCRAPPER_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCRAPPER_KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SCRAPPER_VALKEY_CACHE_ENABLED: "false"
      SCRAPPER_VALKEY_CLUSTER_NODES: host.docker.internal:6380,host.docker.internal:6381,host.docker.internal:6382
      SCRAPPER_PUSHGATEWAY_ENABLED: "true"
      SCRAPPER_PUSHGATEWAY_ADDRESS: pushgateway:9091
      SCRAPPER_POLLING_ENABLED: ${SCRAPPER_POLLING_ENABLED:-false}
      APP_CLIENTS_BOT_BASE_URL: http://bot:8080
      GITHUB_TOKEN: ${GITHUB_TOKEN:-local-dev-token}
      STACKOVERFLOW_KEY: ${STACKOVERFLOW_KEY:-local-dev-key}
      STACKOVERFLOW_ACCESS_KEY: ${STACKOVERFLOW_ACCESS_KEY:-local-dev-access-token}
    ports:
      - "8081:8081"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: linktracker-observability-bot:0.0.1
    container_name: linktracker-bot
    depends_on:
      scrapper:
        condition: service_started
      schema-registry:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      pushgateway:
        condition: service_started
    environment:
      BOT_SCRAPPER_BASE_URL: http://scrapper:8081
      BOT_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      BOT_KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      BOT_PUSHGATEWAY_ENABLED: "true"
      BOT_PUSHGATEWAY_ADDRESS: pushgateway:9091
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
    ports:
      - "8080:8080"
      - "8011:8011"

  pushgateway:
    image: prom/pushgateway:v1.11.2
    container_name: linktracker-pushgateway
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: linktracker-prometheus
    depends_on:
      scrapper:
        condition: service_started
      bot:
        condition: service_started
      pushgateway:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: linktracker-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  valkey-cluster-1-data:
  valkey-cluster-2-data:
  valkey-cluster-3-data:
  valkey-cluster-4-data:
  valkey-cluster-5-data:
  valkey-cluster-6-data:
  prometheus-data:
  grafana-data:

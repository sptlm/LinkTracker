server:
  port: 8080

spring:
  application:
    name: bot

app:
  http-client:
    connect-timeout: ${BOT_HTTP_CONNECT_TIMEOUT:1s}
    read-timeout: ${BOT_HTTP_READ_TIMEOUT:2s}
  resilience:
    http:
      retryable-statuses: ${BOT_HTTP_RETRYABLE_STATUSES:500,502,503,504}
  notifications:
    transport: ${BOT_NOTIFICATION_TRANSPORT:KAFKA}
  kafka:
    bootstrap-servers: ${BOT_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    updates-topic: ${BOT_KAFKA_UPDATES_TOPIC:link-updates}
    group-id: ${BOT_KAFKA_GROUP_ID:bot-updates-consumer}
    key-deserializer: ${BOT_KAFKA_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
    value-deserializer: ${BOT_KAFKA_VALUE_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
    dlq-key-serializer: ${BOT_KAFKA_DLQ_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
    dlq-value-serializer: ${BOT_KAFKA_DLQ_VALUE_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
    schema-registry-url: ${BOT_KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8085}
    dlq-topic: ${BOT_KAFKA_DLQ_TOPIC:link-updates-dlq}
    dlq-topic-partitions: ${BOT_KAFKA_DLQ_TOPIC_PARTITIONS:3}
    dlq-topic-replication-factor: ${BOT_KAFKA_DLQ_TOPIC_REPLICATION_FACTOR:3}
    max-attempts: ${BOT_KAFKA_MAX_ATTEMPTS:3}
    idempotency-cache-size: ${BOT_KAFKA_IDEMPOTENCY_CACHE_SIZE:10000}
  telegram:
    url: https://api.telegram.org/bot
    token: ${TELEGRAM_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    update-listener-sleep: 1s
    debug: false
  scrapper:
    base-url: ${BOT_SCRAPPER_BASE_URL:http://localhost:8081}
  messages:
    unknown-command: "Неизвестная команда. Воспользуйтесь /help, чтобы посмотреть список доступных команд."
    start-welcome: "Ку, %s! Используйте /help, чтобы посмотреть доступные команды."
    welcome-back: "С возвращением, %s! Используйте /help, чтобы посмотреть доступные команды."
    help-header: "Доступные команды:"
    track-started: "Пришлите ссылку, которую хотите отслеживать."
    track-ask-tags: "Теперь пришлите теги через запятую или отправьте '-' если теги не нужны."
    track-ask-filters: "Теперь пришлите фильтры через запятую или отправьте '-' если фильтры не нужны."
    track-cancelled: "Отслеживание ссылки отменено."
    nothing-to-cancel: "Сейчас нечего отменять."
    invalid-link: "Некорректная ссылка."
    already-tracked: "Ссылка уже отслеживается"
    link-tracked: "Ссылка добавлена в отслеживание."
    link-removed: "Ссылка удалена из отслеживания."
    link-not-found: "Ссылка не найдена."
    no-tracked-links: "У вас нет отслеживаемых ссылок."
    chat-not-registered: "Сначала используйте /start."
    untrack-usage: "Использование: /untrack <ссылка>"
    scrapper-unavailable: "Сервис отслеживания сейчас недоступен. Попробуйте позже."
    updates-template: |
      Обнаружено обновление по ссылке: %s
      %s

resilience4j:
  retry:
    instances:
      scrapper:
        max-attempts: ${BOT_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${BOT_RETRY_WAIT_DURATION:250ms}
        retry-exceptions:
          - backend.academy.linktracker.bot.client.scrapper.RetryableScrapperClientException
        enable-exponential-backoff: ${BOT_RETRY_EXPONENTIAL_BACKOFF_ENABLED:false}
        exponential-backoff-multiplier: ${BOT_RETRY_EXPONENTIAL_BACKOFF_MULTIPLIER:2}
        exponential-max-wait-duration: ${BOT_RETRY_EXPONENTIAL_MAX_WAIT_DURATION:5s}
  circuitbreaker:
    instances:
      scrapper:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${BOT_CB_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${BOT_CB_MINIMUM_REQUIRED_CALLS:5}
        failure-rate-threshold: ${BOT_CB_FAILURE_RATE_THRESHOLD:50}
        permitted-number-of-calls-in-half-open-state: ${BOT_CB_PERMITTED_CALLS_IN_HALF_OPEN_STATE:5}
        wait-duration-in-open-state: ${BOT_CB_WAIT_DURATION_IN_OPEN_STATE:1s}
        automatic-transition-from-open-to-half-open-enabled: ${BOT_CB_AUTO_TRANSITION_ENABLED:true}
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: scrapper
    metrics_path: /metrics
    static_configs:
      - targets:
          - scrapper:8012
        labels:
          application: scrapper
          app_type: scrapper

  - job_name: bot
    metrics_path: /metrics
    static_configs:
      - targets:
          - bot:8011
        labels:
          application: bot
          app_type: bot

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091

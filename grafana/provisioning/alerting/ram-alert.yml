apiVersion: 1

groups:
  - orgId: 1
    name: Link Tracker RAM
    folder: Link Tracker
    interval: 1m
    rules:
      - uid: linktracker-high-ram
        title: High process RAM usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum by (application) (process_resident_memory_bytes)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 536870912
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        for: 2m
        annotations:
          summary: Process resident memory is above 512 MiB for {{ $labels.application }}.
        labels:
          severity: warning
        isPaused: false

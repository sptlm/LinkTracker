ai-agent:
  filtering:
    stop-words: []
    excluded-authors: []
    min-length: 0
  summarization:
    provider: STUB
    threshold: 500
  prioritization:
    high-keywords:
      - critical
      - urgent
      - breaking
      - security
    low-keywords:
      - minor
      - typo
      - chore
      - docs
  grouping:
    window-ms: 50ms
